[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "la-sensei"
version = "0.1.0"
description = "Executable structural linear algebra laboratories for One Language, Many Dialects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "HoloMathics, LLC"}]
keywords = ["finite-fields", "linear-algebra", "education", "coding-theory", "tropical-algebra"]
dependencies = []

[project.optional-dependencies]
lab = ["numpy>=1.24", "matplotlib>=3.7", "sympy>=1.12", "jupyterlab>=4", "nbformat>=5"]
test = ["pytest>=8"]

[project.scripts]
la-sensei = "lasensei.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
